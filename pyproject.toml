[project]
name = "frame-check"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "frame-check-core",
    "frame-check-lsp",
]

[tool.uv.workspace]
members = [
    "frame-check-core",
    "frame-check-lsp",
]

[tool.uv.sources]
frame-check-core = { workspace = true }
frame-check-lsp = { workspace = true }


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "mypy>=1.20.0",
    "pandas>=3.0.2",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-codspeed>=4.3.0",
    "tabulate>=0.10.0",
    "tomlkit>=0.13.3",
    "types-psutil>=7.2.2.20260408",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.30.1",
    "pymdown-extensions>=10.21.2",
    "zensical>=0.0.32",
]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
exclude = ['frame-check-extensions']


[tool.frame-check]
exclude = [
    'frame-check-extensions/',
    'frame-check-core/tests'
]
